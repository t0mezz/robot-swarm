; platformio.ini
; Robot Swarm — PlatformIO Monorepo
;
; Kompilieren:
;   pio run -e receiver          # Receiver bauen
;   pio run -e dongle            # Dongle bauen
;
; Flashen:
;   pio run -e receiver -t upload
;   pio run -e dongle -t upload
;
; Robot-ID beim Flashen setzen:
;   ROBOT_ID=5 pio run -e receiver -t upload

[platformio]
default_envs = receiver, dongle

; ─── Gemeinsame Einstellungen ─────────────────────────────────
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_extra_dirs = lib
extra_scripts = extra_script.py
build_flags =
    -std=c++17
    -Wall

; ─── Receiver (Robot-ESP32-S3 SuperMini) ──────────────────────
[env:receiver]
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_src_filter = +<receiver/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DROBOT_ID=0
monitor_speed = 115200

; ─── Dongle (regulärer ESP32) ────────────────────────────────
[env:dongle]
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
board = esp32dev
build_src_filter = +<dongle/>
build_flags =
    ${env.build_flags}
monitor_speed = 115200


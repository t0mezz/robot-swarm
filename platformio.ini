; platformio.ini
; Robot Swarm — PlatformIO Monorepo
;
; Kompilieren:
;   pio run -e receiver          # Receiver bauen
;   pio run -e dongle            # Dongle bauen
;
; Flashen:
;   pio run -e receiver -t upload
;   pio run -e dongle -t upload
;
; Robot-ID beim Flashen setzen:
;   pio run -e receiver -t upload --build-flag="-DROBOT_ID=3"

[platformio]
default_envs = receiver, dongle

; ─── Gemeinsame Einstellungen ─────────────────────────────────
[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
lib_extra_dirs = lib
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -std=c++17
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ─── Receiver (Robot-ESP32) ───────────────────────────────────
[env:receiver]
build_src_filter = +<receiver/>
build_flags =
    ${env.build_flags}
    -DROBOT_ID=0
monitor_speed = 115200

; ─── Dongle (PC-ESP32) ───────────────────────────────────────
[env:dongle]
build_src_filter = +<dongle/>
build_flags =
    ${env.build_flags}
monitor_speed = 921600

; ─── Receiver pro Roboter (optional) ─────────────────────────
; Entkommentieren und duplizieren für mehrere Roboter.
; Dann: pio run -e robot_0 -t upload

; [env:robot_0]
; extends = env:receiver
; build_flags = ${env.build_flags} -DROBOT_ID=0

; [env:robot_1]
; extends = env:receiver
; build_flags = ${env.build_flags} -DROBOT_ID=1

; [env:robot_2]
; extends = env:receiver
; build_flags = ${env.build_flags} -DROBOT_ID=2

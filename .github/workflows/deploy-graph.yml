name: Deploy graphify graph to Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-graph
  cancel-in-progress: true

jobs:
  deploy-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install graphify
        run: pip install graphifyy

      - name: Rebuild graph (code-only re-extraction + clustering)
        run: |
          graphify update . --no-cluster
          if [ -n "${GEMINI_API_KEY}" ]; then
            graphify cluster-only . --backend gemini
          else
            graphify cluster-only . --no-label
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Publish graph.html to gh-pages
        run: |
          rm -rf /tmp/publish
          mkdir -p /tmp/publish
          cp graphify-out/graph.html /tmp/publish/index.html
          echo "graph.kortec.me" > /tmp/publish/CNAME
          cd /tmp/publish
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html CNAME
          git commit -q -m "Deploy graph for ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
